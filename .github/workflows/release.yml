name: Release

# Every push to main runs this. semantic-release reads the commits since the
# last v* tag: fix → patch, feat → minor, and while 0.x a breaking change is
# also a minor. docs/chore/test/ci/build/refactor alone publish nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the v* tag and the GitHub Release
  id-token: write # npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Master switch: set the repository variable NPM_PUBLISH_ENABLED to "true".
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
